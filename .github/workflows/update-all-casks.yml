name: Update All Casks

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: update-all-casks
  cancel-in-progress: false

jobs:
  update-casks:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"

    steps:
      - name: Set up Homebrew
        id: homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Check versions and auto-merge update PRs
        shell: bash
        env:
          TAP_NAME: ${{ steps.homebrew.outputs.tap-name }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bash update-casks/update.sh
